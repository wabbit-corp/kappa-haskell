name: CI and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to create or update"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kappa-haskell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Haskell compiler
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgc-dev libgmp-dev libuv1-dev pkg-config

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.10.3.0"

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.14.1-cabal-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.14.1-cabal-

      - name: Build
        run: |
          cabal update
          cabal build all

      - name: Test
        run: cabal test all --test-show-details=direct

      - name: Enforce trivial cold-compile budget
        run: scripts/check_trivial_compile_budget.sh

  native-gates:
    name: Native backend and Delve gates
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libgc-dev libgmp-dev pkg-config sqlite3 libsqlite3-dev zlib1g-dev libuv1-dev curl

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.10.3.0"

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.14.1-cabal-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.14.1-cabal-

      - name: Run native gate suite
        shell: bash
        run: |
          set -euo pipefail
          cabal update
          export KAPPA_CC="clang $(pkg-config --cflags --libs bdw-gc gmp)"
          test/native/run-native-tests.sh

  package-compiler:
    name: Package Haskell compiler (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs:
      - test
      - native-gates
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-14
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libgc-dev libgmp-dev libuv1-dev pkg-config

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bdw-gc gmp libuv pkg-config

      - name: Install native dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: minimal
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-gc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-libuv
            mingw-w64-x86_64-pkgconf

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.10.3.0"

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.14.1-cabal-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.14.1-cabal-

      - name: Build release executable
        shell: bash
        run: |
          set -euo pipefail

          cabal update
          out_dir="$PWD/dist/release/kappa-haskell-${{ matrix.platform }}"
          mkdir -p "$out_dir/bin" "$out_dir/runtime"
          exe_ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            exe_ext=".exe"
          fi

          cabal install exe:kappa \
            --install-method=copy \
            --installdir="$out_dir/bin" \
            --overwrite-policy=always

          usage_output="$("$out_dir/bin/kappa${exe_ext}" 2>&1 || true)"
          grep -q '^usage: kappa' <<<"$usage_output"

          cp LICENSE "$out_dir/LICENSE"
          cp CHANGELOG.md "$out_dir/CHANGELOG.md"
          cp docs/Spec.md "$out_dir/Spec.md"
          cp TESTING.md "$out_dir/TESTING.md"
          cp SPEC_COMPLIANCE.md "$out_dir/SPEC_COMPLIANCE.md" || true
          cp runtime/*.c runtime/*.h "$out_dir/runtime/"

          mkdir -p "$PWD/dist/assets"
          tar -C "$PWD/dist/release" -czf "$PWD/dist/assets/kappa-haskell-${{ matrix.platform }}.tar.gz" "kappa-haskell-${{ matrix.platform }}"

      - name: Test relocated compiler archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          archive="$PWD/dist/assets/kappa-haskell-${{ matrix.platform }}.tar.gz"
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf "$archive" -C "$extract_dir"
          package_dir="$extract_dir/kappa-haskell-${{ matrix.platform }}"
          cp test/native/cases/arith.kp "$extract_dir/release-smoke.kp"
          cc_cmd="clang $(pkg-config --cflags --libs bdw-gc gmp libuv)"

          smoke_output="$({
            cd "$extract_dir"
            "$package_dir/bin/kappa" build release-smoke.kp \
              -o release-smoke --cc "$cc_cmd" >/dev/null
            ./release-smoke
          })"
          test "$smoke_output" = $'120\n5050\n4\n15'

      - name: Test relocated compiler archive (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail

          archive="$PWD/dist/assets/kappa-haskell-${{ matrix.platform }}.tar.gz"
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf "$archive" -C "$extract_dir"
          package_dir="$extract_dir/kappa-haskell-${{ matrix.platform }}"
          cp test/native/cases/arith.kp "$extract_dir/release-smoke.kp"
          cp test/native/cases/blocking-source.kp "$extract_dir/release-blocking-smoke.kp"

          pkgconf_bin="$(command -v pkgconf || command -v pkg-config)"
          cc_bin="$(command -v clang || command -v gcc)"
          "$pkgconf_bin" --exists bdw-gc gmp libuv
          cc_exe="$(cygpath -w "$cc_bin")"
          cc_cmd="$cc_exe $($pkgconf_bin --cflags --libs bdw-gc gmp libuv)"

          smoke_output="$({
            cd "$extract_dir"
            "$package_dir/bin/kappa.exe" build release-smoke.kp \
              -o release-smoke.exe --cc "$cc_cmd" >/dev/null
            ./release-smoke.exe
          } | tr -d '\r')"
          test "$smoke_output" = $'120\n5050\n4\n15'

          blocking_output="$({
            cd "$extract_dir"
            "$package_dir/bin/kappa.exe" build release-blocking-smoke.kp \
              -o release-blocking-smoke.exe --cc "$cc_cmd" >/dev/null
            KAPPA_RT_VALIDATE_GC_THREADS=1 ./release-blocking-smoke.exe
          } | tr -d '\r')"
          test "$blocking_output" = $'before\ninside\nafter'

      - name: Upload compiler package
        uses: actions/upload-artifact@v4
        with:
          name: kappa-haskell-${{ matrix.platform }}
          path: dist/assets/*
          if-no-files-found: error

  package-delve:
    name: Package Delve game (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs:
      - test
      - native-gates
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            test-target: delve-tests-linux
            game-target: delve-linux
            exe-ext: ""
          - os: macos-14
            platform: macos-arm64
            test-target: delve-tests-macos-arm64
            game-target: delve-macos-arm64
            exe-ext: ""
          - os: windows-latest
            platform: windows-x64
            test-target: delve-tests-windows-x64
            game-target: delve-windows-x64
            exe-ext: ".exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgc-dev libgmp-dev libuv1-dev pkg-config

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install bdw-gc gmp libuv pkg-config

      - name: Install native dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: minimal
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-gc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-libuv
            mingw-w64-x86_64-pkgconf

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.10.3.0"

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.14.1-cabal-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.14.1-cabal-

      - name: Install Kappa compiler for Delve (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          cabal update
          compiler_dir="$PWD/dist/release/kappa-haskell-${{ matrix.platform }}"
          mkdir -p "$compiler_dir/bin"
          cabal install exe:kappa \
            --install-method=copy \
            --installdir="$compiler_dir/bin" \
            --overwrite-policy=always

      - name: Build compiler and Delve (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          cabal update

          compiler_dir="$PWD/dist/release/kappa-haskell-${{ matrix.platform }}"
          mkdir -p "$compiler_dir/bin"
          cabal install exe:kappa \
            --install-method=copy \
            --installdir="$compiler_dir/bin" \
            --overwrite-policy=always

          game_dir="$PWD/dist/release/delve-${{ matrix.platform }}"
          mkdir -p "$game_dir"
          cc_cmd="cc $(pkg-config --cflags --libs bdw-gc gmp libuv)"
          export KAPPA_CC="$cc_cmd"

          "$compiler_dir/bin/kappa" build \
            --update \
            --manifest examples/packages/delve \
            --target "${{ matrix.test-target }}" \
            -o "$game_dir/delve-tests${{ matrix.exe-ext }}" \
            --cc "$cc_cmd"

          cp -R examples/packages/delve/assets "$game_dir/assets"
          mkdir -p "$game_dir/saves"
          touch "$game_dir/saves/.gitkeep"
          test -f "$game_dir/assets/delve/pack.json"
          test -f "$game_dir/assets/delve/items.json"
          test -f "$game_dir/assets/delve/systems.json"

          "$compiler_dir/bin/kappa" build \
            --update \
            --manifest examples/packages/delve \
            --target "${{ matrix.game-target }}" \
            -o "$game_dir/delve${{ matrix.exe-ext }}" \
            --cc "$cc_cmd"

          cp LICENSE "$game_dir/LICENSE"
          cp examples/packages/delve/README.md "$game_dir/README.md"
          cp examples/packages/delve/DESIGN.md "$game_dir/DESIGN.md"

          mkdir -p "$PWD/dist/assets"
          archive="$PWD/dist/assets/delve-${{ matrix.platform }}.tar.gz"
          tar -C "$PWD/dist/release" -czf "$archive" "delve-${{ matrix.platform }}"

          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf "$archive" -C "$extract_dir"
          packaged_dir="$extract_dir/delve-${{ matrix.platform }}"
          test_output="$(cd "$packaged_dir" && "./delve-tests${{ matrix.exe-ext }}")"
          printf '%s\n' "$test_output"
          grep -q '^DELVE TESTS: ALL PASS$' <<<"$test_output"

      - name: Build compiler and Delve (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail

          compiler_dir="$PWD/dist/release/kappa-haskell-${{ matrix.platform }}"
          game_dir="$PWD/dist/release/delve-${{ matrix.platform }}"
          mkdir -p "$game_dir"

          pkgconf_bin="$(command -v pkgconf || command -v pkg-config || true)"
          cc_bin="$(command -v clang || command -v gcc || true)"
          objdump_bin="$(command -v objdump || true)"
          if [[ -z "$pkgconf_bin" || -z "$cc_bin" || -z "$objdump_bin" ]]; then
            printf 'Windows native tool lookup failed.\n' >&2
            printf 'pkgconf=%s\n' "$pkgconf_bin" >&2
            printf 'cc=%s\n' "$cc_bin" >&2
            printf 'objdump=%s\n' "$objdump_bin" >&2
            printf 'PATH=%s\n' "$PATH" >&2
            exit 1
          fi
          "$pkgconf_bin" --exists bdw-gc gmp libuv
          cc_exe="$(cygpath -w "$cc_bin")"
          cc_cmd="$cc_exe $("$pkgconf_bin" --cflags --libs bdw-gc gmp libuv)"
          export KAPPA_CC="$cc_cmd"

          chcp.com 65001 >/dev/null || true
          windows_dir="${WINDIR:-${SYSTEMROOT:?Windows directory is unavailable}}"
          windows_system_dir="$(cygpath -u "$windows_dir/System32")"

          "$compiler_dir/bin/kappa.exe" build \
            --update \
            --manifest examples/packages/delve \
            --target "${{ matrix.test-target }}" \
            -o "$game_dir/delve-tests${{ matrix.exe-ext }}" \
            --cc "$cc_cmd"

          cp -R examples/packages/delve/assets "$game_dir/assets"
          mkdir -p "$game_dir/saves"
          touch "$game_dir/saves/.gitkeep"
          test -f "$game_dir/assets/delve/pack.json"
          test -f "$game_dir/assets/delve/items.json"
          test -f "$game_dir/assets/delve/systems.json"

          "$compiler_dir/bin/kappa.exe" build \
            --update \
            --manifest examples/packages/delve \
            --target "${{ matrix.game-target }}" \
            -o "$game_dir/delve${{ matrix.exe-ext }}" \
            --cc "$cc_cmd"

          copy_mingw_dll_closure() {
            local destination="$1"
            shift
            local -a queue=("$@")
            local index=0
            declare -A seen=()

            while ((index < ${#queue[@]})); do
              local binary="${queue[$index]}"
              index=$((index + 1))
              local imports
              if ! imports="$("$objdump_bin" -p "$binary" | sed -n 's/^[[:space:]]*DLL Name: //p')"; then
                printf 'failed to inspect DLL imports for %s\n' "$binary" >&2
                return 1
              fi
              if [[ -z "$imports" ]]; then
                printf 'DLL inspection returned no imports for %s\n' "$binary" >&2
                return 1
              fi
              while IFS= read -r dll; do
                [[ -n "$dll" ]] || continue
                local key="${dll,,}"
                [[ -z "${seen[$key]:-}" ]] || continue
                seen[$key]=1

                local dependency
                dependency="$(find /mingw64/bin -maxdepth 1 -type f -iname "$dll" -print -quit)"
                if [[ -n "$dependency" ]]; then
                  local copied="$destination/$(basename "$dependency")"
                  cp -f "$dependency" "$copied"
                  queue+=("$copied")
                elif [[ -f "$windows_system_dir/$dll" ]]; then
                  :
                elif [[ "$key" == api-ms-win-*.dll || "$key" == ext-ms-win-*.dll ]]; then
                  :
                else
                  printf 'unresolved non-system DLL import %s from %s\n' "$dll" "$binary" >&2
                  return 1
                fi
              done <<<"$imports"
            done
          }

          copy_mingw_dll_closure \
            "$game_dir" \
            "$game_dir/delve-tests${{ matrix.exe-ext }}" \
            "$game_dir/delve${{ matrix.exe-ext }}"
          cp LICENSE "$game_dir/LICENSE"
          cp examples/packages/delve/README.md "$game_dir/README.md"
          cp examples/packages/delve/DESIGN.md "$game_dir/DESIGN.md"

          mkdir -p "$PWD/dist/assets"
          archive="$PWD/dist/assets/delve-${{ matrix.platform }}.tar.gz"
          tar -C "$PWD/dist/release" -czf "$archive" "delve-${{ matrix.platform }}"

          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf "$archive" -C "$extract_dir"
          packaged_dir="$extract_dir/delve-${{ matrix.platform }}"
          test_output="$({
            cd "$packaged_dir"
            PATH="$windows_system_dir" "./delve-tests${{ matrix.exe-ext }}"
          })"
          test_output="${test_output//$'\r'/}"
          printf '%s\n' "$test_output"
          grep -q '^DELVE TESTS: ALL PASS$' <<<"$test_output"

      - name: Upload Delve package
        uses: actions/upload-artifact@v4
        with:
          name: delve-${{ matrix.platform }}
          path: dist/assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - package-compiler
      - package-delve
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          repo="${GITHUB_REPOSITORY}"

          resolve_tag_commit() {
            local tag_name="$1"
            local object_record object_type object_sha
            local depth=0

            if ! object_record="$(
              gh api "repos/$repo/git/ref/tags/$tag_name" \
                --jq '.object | [.type, .sha] | @tsv' 2>&1
            )"; then
              if [[ "$object_record" == *"HTTP 404"* ]]; then
                return 2
              fi
              printf 'failed to resolve release tag %s: %s\n' "$tag_name" "$object_record" >&2
              return 1
            fi
            IFS=$'\t' read -r object_type object_sha <<<"$object_record"

            while [[ "$object_type" == "tag" ]]; do
              depth=$((depth + 1))
              if ((depth > 16)); then
                printf 'release tag %s exceeds the annotated-tag peel limit\n' "$tag_name" >&2
                return 1
              fi
              if ! object_record="$(
                gh api "repos/$repo/git/tags/$object_sha" \
                  --jq '.object | [.type, .sha] | @tsv' 2>&1
              )"; then
                printf 'failed to peel release tag %s: %s\n' "$tag_name" "$object_record" >&2
                return 1
              fi
              IFS=$'\t' read -r object_type object_sha <<<"$object_record"
            done

            if [[ "$object_type" != "commit" || ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              printf 'release tag %s resolves to unsupported object %s (%s)\n' \
                "$tag_name" "$object_type" "$object_sha" >&2
              return 1
            fi
            printf '%s\n' "$object_sha"
          }

          tag_exists=false
          if tagged_sha="$(resolve_tag_commit "$tag")"; then
            tag_exists=true
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              printf 'release tag %s resolves to %s, but assets were built from %s\n' \
                "$tag" "$tagged_sha" "$GITHUB_SHA" >&2
              exit 1
            fi
          else
            resolve_status=$?
            if [[ "$resolve_status" -ne 2 ]]; then
              exit "$resolve_status"
            fi
          fi

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            if [[ "$tag_exists" != true ]]; then
              printf 'release %s exists without a resolvable tag\n' "$tag" >&2
              exit 1
            fi
            gh release upload "$tag" release-assets/* --repo "$repo" --clobber
          else
            gh release create "$tag" release-assets/* \
              --repo "$repo" \
              --target "$GITHUB_SHA" \
              --title "Kappa Haskell compiler ${tag}" \
              --notes "Automated Haskell compiler and Delve release for ${tag}."
          fi
